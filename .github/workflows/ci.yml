name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      # The core must never need cgo. This is a hard requirement, not a
      # preference: it is what makes the binary portable across distros.
      - name: build (pure static, no cgo)
        run: CGO_ENABLED=0 go build -trimpath ./cmd/hinged

      - name: vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: test
        run: go test -race -cover ./...
