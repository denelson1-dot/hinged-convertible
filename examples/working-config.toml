# hinged configuration
#
#   hinged config    show what is loaded and from where

[posture]
# Verified on this machine: asserts at 210, releases at 180, no flapping
# across a full fold cycle. Left at the defaults deliberately.

# ---------------------------------------------------------------------------
# Touch input panel.
#
# A folded convertible has no keyboard, so dictation and the on-screen keyboard
# both need an on-screen target. The panel is that target, and it drives both:
# the microphone button talks to vox, the keyboard button launches Onboard.
#
# It is an override-redirect X11 window, so the window manager never gives it
# focus -- which matters because tapping it must not steal focus from whatever
# you are dictating into.
# ---------------------------------------------------------------------------

[[hooks]]
event   = "tablet"
command = ["hinged-panel"]
async   = true

[[hooks]]
event   = "tent"
command = ["hinged-panel"]
async   = true

[[hooks]]
event   = "laptop"
command = ["pkill", "-x", "hinged-panel"]
ignore_exit = true

[[hooks]]
event   = "closed"
command = ["pkill", "-x", "hinged-panel"]
ignore_exit = true

# On Cinnamon the panel drives the shell's own keyboard over D-Bus rather than
# launching Onboard. That is not a preference: a shell's menus take a modal
# grab, and clicking a separate keyboard application dismisses them, so typing
# into the start menu with Onboard closes the menu. The shell's own keyboard
# lives in the same process as its menus and does not break their grabs.
#
# Onboard is still the better keyboard for ordinary application text fields,
# and remains the default on desktops that ship no keyboard of their own.
#
# Close the shell's keyboard on unfold. The panel is killed at the same moment,
# so nothing else would: an on-screen keyboard left covering a third of the
# screen after returning to laptop posture is worse than never showing it.
#
# Eval close() rather than ToggleKeyboard, because a toggle would open the
# keyboard if it happened to be closed already.
[[hooks]]
event   = "laptop"
command = ["gdbus", "call", "--session", "--dest", "org.Cinnamon", "--object-path", "/org/Cinnamon", "--method", "org.Cinnamon.Eval", "Main.virtualKeyboardManager.close();true"]
ignore_exit = true

[[hooks]]
event   = "closed"
command = ["gdbus", "call", "--session", "--dest", "org.Cinnamon", "--object-path", "/org/Cinnamon", "--method", "org.Cinnamon.Eval", "Main.virtualKeyboardManager.close();true"]
ignore_exit = true

# Kept as a safety net in case Onboard was started by something else.
[[hooks]]
event   = "laptop"
command = ["pkill", "-KILL", "-x", "onboard"]
ignore_exit = true

# Abandon any dictation still in flight, so a half-finished transcript cannot
# type itself into whatever you opened next.
[[hooks]]
event   = "laptop"
command = ["vox", "cancel"]
ignore_exit = true

[[hooks]]
event   = "closed"
command = ["vox", "cancel"]
ignore_exit = true
